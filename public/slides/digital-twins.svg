<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A process plant on the left and its wireframe digital twin on the right, linked by data" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>

    <circle cx="552" cy="388" r="6"/><circle cx="448" cy="326" r="6"/>
    <circle cx="524" cy="446" r="6"/><circle cx="583" cy="176" r="6"/>
    <circle cx="500" cy="306" r="6"/><circle cx="614" cy="204" r="0"/>
  </g>

  <!-- data links -->
  <g fill="none" stroke="#8fdcf9" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9">

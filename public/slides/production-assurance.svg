    <rect x="212" y="372" width="24" height="52"/>
    <rect x="186" y="384" width="76" height="16"/>
    <rect x="206" y="352" width="36" height="20"/>
  </g>
  <circle cx="176" cy="392" r="11" fill="#00aeef" stroke="#ffffff" stroke-width="4"/>
  <circle cx="224" cy="340" r="11" fill="#00aeef" stroke="#ffffff" stroke-width="4"/>

  <!-- pipeline -->
  <path d="M262 392H330V420H392" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <path d="M262 392H330V420H392" fill="none" stroke="#00aeef" stroke-width="5" stroke-dasharray="14 12" stroke-linejoin="round"/>
  <path d="M508 420H560" fill="none" stroke="#ffffff" stroke-width="12"/>
  <path d="M508 420H560" fill="none" stroke="#00aeef" stroke-width="5" stroke-dasharray="14 12"/>


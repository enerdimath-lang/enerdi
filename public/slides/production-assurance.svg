  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#8fdcf9" stroke-opacity="0.12" stroke-width="1">
    <path d="M120 150H680M120 200H680M120 250H680M120 300H680"/>
    <path d="M200 110V330M300 110V330M400 110V330M500 110V330M600 110V330"/>
  </g>


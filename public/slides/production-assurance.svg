  <rect x="388" y="392" width="124" height="52" rx="26" fill="#00205b" stroke="#ffffff" stroke-width="5"/>
  <path d="M414 418H486" stroke="#00aeef" stroke-width="5" stroke-linecap="round"/>
  <path d="M420 444V452M480 444V452" stroke="#ffffff" stroke-width="5"/>
  <path d="M450 392V370" stroke="#ffffff" stroke-width="5"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A wellhead feeding a pipeline, separator and storage tank, with production rising" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0b2f7a"/>
      <stop offset="1" stop-color="#000b2e"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00aeef" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00aeef" stop-opacity="0"/>

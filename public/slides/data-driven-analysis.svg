<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Bars, a trend line and scattered data points on a chart" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0b2f7a"/>
      <stop offset="1" stop-color="#000b2e"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- axes and grid -->
  <g stroke="#8fdcf9" stroke-opacity="0.14" stroke-width="1">
    <path d="M170 170H650M170 230H650M170 290H650M170 350H650M170 410H650"/>
  </g>
  <path d="M170 130V450H650" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bars -->
  <g>
    <rect x="200" y="360" width="44" height="88" fill="#00aeef" fill-opacity="0.45"/>
    <rect x="268" y="322" width="44" height="126" fill="#00aeef" fill-opacity="0.55"/>
    <rect x="336" y="342" width="44" height="106" fill="#00aeef" fill-opacity="0.65"/>
    <rect x="404" y="280" width="44" height="168" fill="#00aeef" fill-opacity="0.75"/>
    <rect x="472" y="246" width="44" height="202" fill="#00aeef" fill-opacity="0.88"/>
    <rect x="540" y="196" width="44" height="252" fill="#00aeef"/>
  </g>

  <!-- scatter -->
  <g fill="#8fdcf9" fill-opacity="0.75">
    <circle cx="214" cy="318" r="6"/><circle cx="250" cy="290" r="5"/>
    <circle cx="286" cy="270" r="6"/><circle cx="330" cy="286" r="5"/>
    <circle cx="366" cy="246" r="6"/><circle cx="396" cy="222" r="5"/>
    <circle cx="440" cy="232" r="6"/><circle cx="470" cy="190" r="5"/>
    <circle cx="512" cy="204" r="6"/><circle cx="548" cy="160" r="5"/>
    <circle cx="590" cy="170" r="6"/><circle cx="604" cy="230" r="5"/>
    <circle cx="300" cy="230" r="5"/><circle cx="236" cy="252" r="5"/>
  </g>

  <!-- trend line -->
  <path d="M196 322 L290 284 L358 262 L426 216 L494 196 L600 142" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#00205b" stroke="#ffffff" stroke-width="5">
    <circle cx="290" cy="284" r="9"/>
    <circle cx="426" cy="216" r="9"/>
    <circle cx="494" cy="196" r="9"/>
  </g>
  <circle cx="600" cy="142" r="13" fill="#00aeef" stroke="#ffffff" stroke-width="5"/>
  <circle cx="600" cy="142" r="26" fill="none" stroke="#00aeef" stroke-opacity="0.5" stroke-width="3"/>

  <!-- insight card -->
  <g>
    <rect x="212" y="146" width="150" height="62" rx="31" fill="#000b2e" stroke="#00aeef" stroke-width="3"/>
    <path d="M240 166h60M240 186h94" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="326" cy="166" r="7" fill="#00aeef"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

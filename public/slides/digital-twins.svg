  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- floor -->
  <path d="M130 446H670" stroke="#8fdcf9" stroke-opacity="0.45" stroke-width="3"/>
  <path d="M400 130V470" stroke="#8fdcf9" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- physical asset (solid) -->
  <g stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <rect x="186" y="204" width="62" height="242" rx="31" fill="#00205b"/>

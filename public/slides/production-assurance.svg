  <path d="M170 300 C230 296 262 268 310 262 S388 232 430 214 S520 166 630 138 L630 330 L170 330 Z" fill="url(#area)"/>
  <path d="M170 300 C230 296 262 268 310 262 S388 232 430 214 S520 166 630 138" fill="none" stroke="#00aeef" stroke-width="6" stroke-linecap="round"/>
  <path d="M170 312 C250 310 330 300 430 290 S560 270 630 262" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>
  <g fill="#ffffff" stroke="#00aeef" stroke-width="5">
    <circle cx="310" cy="262" r="9"/>
    <circle cx="430" cy="214" r="9"/>
    <circle cx="538" cy="170" r="9"/>
  </g>
  <path d="M606 126 L640 134 L620 162" fill="none" stroke="#00aeef" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

